services:

  postgres:
    image: postgres:17
    container_name: finpay-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: finpay
      POSTGRES_USER: finpay
      POSTGRES_PASSWORD: finpay

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpay -d finpay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: